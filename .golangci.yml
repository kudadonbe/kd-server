run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor

linters:
  enable:
    - govet
    - staticcheck
    - gosimple
    - errcheck
    - gofumpt
    - revive
  disable:
    - wsl

linters-settings:
  gofumpt:
    extra-rules: true
  revive:
    severity: warning
    confidence: 0.8
issues:
  exclude-use-default: false
  max-same-issues: 0
  max-issues-per-linter: 0
